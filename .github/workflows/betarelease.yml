name: Build and Release Beta APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release? (true / false)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Upgraded to v5 (Node 24 compatible)
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Upgraded to v5 (Node 24 compatible)
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Upgraded to v4 (Node 24 compatible)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Locate Unsigned APK
        id: locate_apk
        run: |
          echo "Locating built APK..."
          APK_FILE=$(find build/app/outputs/ -type f -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs/ -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK found in build/app/outputs!"
            exit 1
          fi

          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_ENV

      - name: Sign Android APK
        id: sign_apk
        run: |
          UNSIGNED_APK="${{ env.apk_path }}"
          OUTPUT_DIR="$(dirname "$UNSIGNED_APK")"
          ALIGNED_APK="$OUTPUT_DIR/app-release-aligned.apk"
          FINAL_SIGNED_APK="$OUTPUT_DIR/ProCalc-release.apk"

          # Detect latest installed Android build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          # Decode Keystore
          echo "${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}" | base64 -d > keystore.jks

          # 1. Zipalign APK
          echo "Aligning APK..."
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 2. Sign APK with apksigner
          echo "Signing APK..."
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:"${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --out "$FINAL_SIGNED_APK" \
            "$ALIGNED_APK"

          # 3. Verify signature
          echo "Verifying signature..."
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$FINAL_SIGNED_APK"

          # Clean up temporary keystore file
          rm -f keystore.jks

          echo "Signed APK created at: $FINAL_SIGNED_APK"
          echo "final_apk=$FINAL_SIGNED_APK" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pro-calc-release-apk
          path: ${{ steps.sign_apk.outputs.final_apk }}
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ### Pro-Calc Release v1.0.${{ github.run_number }}
            - **Branch**: `main`
            - **Commit**: `${{ github.sha }}`
            - **Flutter Version**: `3.50.x`
          draft: false
          prerelease: false
          files: ${{ steps.sign_apk.outputs.final_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}